[package]
name = "ai-monitor"
version = "0.4.0"
edition = "2024"
description = "Monitor nativo de ai-memory e Docker para macOS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/cristianovallory/ai-monitor"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_extras = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
lto = "thin"
strip = true
